appId: br.com.studioimpacto.impacto
productName: Impacto
copyright: Studio Impacto
directories:
  output: dist
  buildResources: build
files:
  - main.cjs
  - preload.cjs
  - package.json
extraResources:
  - from: ../.next/standalone
    to: app
    filter:
      - "**/*"
      - "!**/.env*"
  - from: runtime.env
    to: app/runtime.env
mac:
  category: public.app-category.business
  icon: build/icon.png
  target:
    - target: dmg
    - target: dir
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: Impacto-Setup-${version}-windows-${arch}.${ext}
  executableName: Impacto
  legalTrademarks: Studio Impacto
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Impacto
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages: [pt_BR]
  language: "1046"
dmg:
  title: Impacto
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

publish: null
